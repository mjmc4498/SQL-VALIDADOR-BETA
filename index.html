<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de SQL para GCP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="Logo Interseguro" class="logo">
        <h1>Generador de Consultas de Validación SQL</h1>
    </header>

    <div id="app">
        <div class="module">
            <form id="unified-form">
                <h2>Parámetros de Entrada</h2>

                <div class="form-section">
                    <label for="project1">Proyecto 1 (origen):</label>
                    <input type="text" id="project1" placeholder="Ej: mi-proyecto-origen" required>
                </div>

                <div class="form-section">
                    <label for="dataset1">Dataset 1 (origen):</label>
                    <input type="text" id="dataset1" placeholder="Ej: mi_dataset_origen" required>
                </div>

                <div class="form-section">
                    <label for="table1">Tablas 1 (origen, separadas por coma):</label>
                    <input type="text" id="table1" placeholder="Ej: tabla_a, tabla_b" required>
                </div>

                <hr>

                <div class="form-section">
                    <label for="project2">Proyecto 2 (destino, opcional):</label>
                    <input type="text" id="project2" placeholder="Ej: mi-proyecto-destino">
                </div>

                <div class="form-section">
                    <label for="dataset2">Dataset 2 (destino):</label>
                    <input type="text" id="dataset2" placeholder="Ej: mi_dataset_destino" required>
                </div>

                <div class="form-section">
                    <label for="table2">Tablas 2 (destino, separadas por coma):</label>
                    <input type="text" id="table2" placeholder="Ej: tabla_c, tabla_d" required>
                </div>

                <hr>

                <div class="form-section">
                    <label for="key-columns">Columnas Llave (para validación, separadas por comas):</label>
                    <input type="text" id="key-columns" placeholder="Ej: id_cliente, fecha">
                </div>

                <div class="form-section">
                    <label for="filters">Filtros (cláusula WHERE, opcional):</label>
                    <input type="text" id="filters" placeholder="Ej: fecha > '2023-01-01' AND pais = 'MX'">
                </div>

                <button type="submit">Generar Consulta de Resumen</button>
            </form>
        </div>

        <div class="module">
            <h2>Consulta de Resumen Generada</h2>
            <textarea id="output" readonly></textarea>
            <button id="copy-all">Copiar Consulta</button>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
