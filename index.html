<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de SQL para GCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Generador de SQL para GCP</h1>

    <div id="app">
        <div class="module">
            <form id="unified-form">
                <h2>Parámetros de Entrada</h2>

                <div class="form-section">
                    <label for="dataset">Dataset:</label>
                    <input type="text" id="dataset" placeholder="Ej: mi_dataset" required>
                </div>

                <div class="form-section">
                    <label for="table1">Tabla 1 (origen):</label>
                    <input type="text" id="table1" placeholder="Ej: tabla_origen" required>
                </div>

                <div class="form-section">
                    <label for="table2">Tabla 2 (destino):</label>
                    <input type="text" id="table2" placeholder="Ej: tabla_destino" required>
                </div>

                <div class="form-section">
                    <label for="key-columns">Columnas Llave (para validación campo a campo, separadas por comas):</label>
                    <input type="text" id="key-columns" placeholder="Ej: id_cliente, fecha">
                </div>

                <button type="submit">Generar Todas las Consultas</button>
            </form>
        </div>

        <div class="module">
            <h2>Consultas SQL Generadas</h2>
            <textarea id="output" readonly></textarea>
            <button id="copy-all">Copiar Todo</button>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
